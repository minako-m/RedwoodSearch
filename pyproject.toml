[project]
name = "redwoodsearch"
version = "0.1.0"
description = "AI assistant for Stanford ExploreCourses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "core", "ingest"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "core/tests", "ingest/tests"]
addopts = "-ra"
