name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks themselves live in the Makefile; CI only installs dependencies and calls it.
jobs:
  api:
    runs-on: ubuntu-latest
    # Same database image as docker-compose.yml; the tests create and wipe redwood_test in it.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: redwood
          POSTGRES_PASSWORD: redwood
          POSTGRES_DB: redwood
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redwood -d redwood"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://redwood:redwood@localhost:5432/redwood
      TEST_DATABASE_URL: postgresql://redwood:redwood@localhost:5432/redwood_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make check-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make check-web
