# Fixed project name so containers and volumes don't depend on the checkout folder's name.
name: redwoodsearch

services:
  db:
    # Postgres with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: redwood
      POSTGRES_PASSWORD: redwood
      POSTGRES_DB: redwood
    ports:
      # Host port 5433, because 5432 is often taken by a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redwood -d redwood"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
